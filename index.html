<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="./assets/tavern/icon_ale.png" />
  <title>Nyah &amp; Fifi's Tavern</title>
  <style>
    :root {
      --bg-outer: rgb(29, 32, 51);
      --panel-bg: rgb(74, 44, 29);
      --panel-border: rgb(201, 138, 44);
      --parch-bg: rgb(245, 230, 204);
      --ink-dark: rgb(43, 26, 18);
      --gold-hi: rgb(245, 203, 92);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-outer);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace;
    }

    #game-canvas {
      display: block;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      cursor: pointer;
    }

    #save-dialog {
      position: fixed;
      inset: 0;
      background-color: rgba(29, 32, 51, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    #save-dialog.open {
      display: flex;
    }

    .save-card {
      width: min(480px, 92vw);
      background-color: var(--panel-bg);
      border: 3px solid var(--panel-border);
      padding: 14px;
      color: var(--parch-bg);
    }

    .save-card h2 {
      margin: 0 0 8px 0;
      font-size: 16px;
      color: var(--gold-hi);
    }

    .save-card p {
      margin: 0 0 8px 0;
      font-size: 12px;
    }

    #save-textarea {
      width: 100%;
      height: 110px;
      background-color: var(--parch-bg);
      color: var(--ink-dark);
      border: 2px solid var(--panel-border);
      font-family: monospace;
      font-size: 11px;
      padding: 6px;
      resize: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .save-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      justify-content: flex-end;
    }

    .save-actions button {
      background-color: var(--parch-bg);
      color: var(--ink-dark);
      border: 2px solid var(--panel-border);
      font-family: monospace;
      font-weight: bold;
      padding: 5px 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas" width="640" height="360"></canvas>

  <div id="save-dialog" role="dialog" aria-modal="true" aria-label="Export or Import Save">
    <div class="save-card">
      <h2>Export / Import Tavern Save</h2>
      <p>Copy the string below to back up your tavern, or paste a save string and click Import.</p>
      <textarea id="save-textarea" spellcheck="false"></textarea>
      <div class="save-actions">
        <button id="btn-copy-save" type="button">Copy</button>
        <button id="btn-import-save" type="button">Import Save</button>
        <button id="btn-close-save" type="button">Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
